name: Deploy Next.js to Production VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip deploy when SSH secrets are missing
        if: ${{ !((secrets.SERVER_IP != '' || secrets.DROPLET_IP != '') && secrets.SSH_PRIVATE_KEY != '') }}
        run: |
          echo "Deployment skipped: configure SERVER_IP or DROPLET_IP and SSH_PRIVATE_KEY secrets."

      - name: Execute Remote SSH Commands to Deploy
        if: ${{ (secrets.SERVER_IP != '' || secrets.DROPLET_IP != '') && secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP || secrets.DROPLET_IP }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if [ -d ~/_Recurse ]; then cd ~/_Recurse; else cd ~/Recurse; fi
            git pull origin main
            npm install --production=false
            npm run build
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
