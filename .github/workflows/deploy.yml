name: Deploy Next.js to Production VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        id: check_secrets
        env:
          HOST: ${{ secrets.SERVER_IP || secrets.DROPLET_IP }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "Deployment skipped: configure SERVER_IP and SSH_PRIVATE_KEY repository secrets to enable auto-deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets detected. Proceeding with deployment."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Remote SSH Commands to Deploy
        if: steps.check_secrets.outputs.skip != 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP || secrets.DROPLET_IP }}
          username: ${{ secrets.SERVER_USER || 'recurseuser' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if [ -d ~/_Recurse ]; then cd ~/_Recurse; else cd ~/Recurse; fi
            git pull origin main
            npm install --production=false
            npm run build
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
